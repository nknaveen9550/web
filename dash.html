<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
        }

        .header {
            background: #0078D7;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .sidebar {
            width: 220px;
            background: #333;
            color: white;
            padding-top: 20px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            padding: 15px 20px;
            cursor: pointer;
        }

        .sidebar li:hover {
            background: #555;
        }

        .content {
            flex: 1;
            padding: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
            text-align: center;
        }

        .logout {
            background: red;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        .logout:hover {
            background: darkred;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2 id="dashboardTitle">Dashboard</h2>
        <button id="logoutBtn" class="logout">Logout</button>
    </div>

    <div class="container">

        <div class="sidebar">
            <ul>
                <li id="homeMenu">Home</li>
                <li id="profileMenu">Profile</li>
                <li id="ordersMenu">Orders</li>
                <li id="reportsMenu">Reports</li>
                <li id="settingsMenu">Settings</li>
            </ul>
        </div>

        <div class="content">

            <h2>Welcome, <span id="userName">Naveen</span></h2>

            <div class="cards">

                <div class="card">
                    <h3>Total Users</h3>
                    <p id="totalUsers">1250</p>
                </div>

                <div class="card">
                    <h3>Total Orders</h3>
                    <p id="totalOrders">350</p>
                </div>

                <div class="card">
                    <h3>Revenue</h3>
                    <p id="revenue">$12,500</p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
